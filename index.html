<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoramento de Cercas - AgroSB</title>
    <style>
        :root {
            --primary: #2e7d32;
            --bg: #f5f5f5;
            --card: #ffffff;
        }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 800px; background: var(--card); padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #333; text-transform: uppercase; border-bottom: 2px solid var(--primary); padding-bottom: 10px; margin-top: 0; }
        
        .header-info { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 20px; }
        .badge { background: #e8f5e9; padding: 8px 12px; border-radius: 6px; font-size: 0.85em; color: #2e7d32; font-weight: bold; border: 1px solid #c8e6c9; }

        .main-status { background: #4caf50; color: white; padding: 15px; border-radius: 8px; text-align: center; font-weight: bold; margin-bottom: 25px; transition: all 0.3s; }
        .loading { background: #ffa000 !important; animation: pulse 1.5s infinite; }

        .retiro-block { margin-bottom: 20px; }
        .label-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: 600; color: #444; }
        .bar-container { background: #eee; height: 24px; border-radius: 12px; overflow: hidden; position: relative; border: 1px solid #ddd; }
        .segment { background: linear-gradient(90deg, #4caf50, #81c784); height: 100%; display: flex; align-items: center; justify-content: center; color: white; font-size: 0.85em; text-shadow: 1px 1px 2px rgba(0,0,0,0.3); transition: width 1s ease-in-out; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
        
        .footer-legend { display: flex; gap: 15px; font-size: 0.8em; margin-top: 20px; color: #666; border-top: 1px solid #eee; padding-top: 15px; }
        .dot { width: 12px; height: 12px; border-radius: 3px; display: inline-block; margin-right: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Monitoramento de Cercas - AgroSB</h2>
    
    <div class="header-info">
        <div class="badge" id="data-inicio">📅 INÍCIO: --/--/----</div>
        <div class="badge" id="data-atualizacao">🔄 ATUALIZAÇÃO: --/--/----</div>
        <div class="badge" style="background: #f3f3f3; color: #555;">🎯 META: 21.000 m/mês</div>
    </div>

    <div id="barra-geral" class="main-status loading">Sincronizando com Google Sheets...</div>

    <div id="lista-retiros">
        </div>

    <div class="footer-legend">
        <span><span class="dot" style="background:#fdd835"></span> Reforma</span>
        <span><span class="dot" style="background:#4caf50"></span> Nova</span>
        <span><span class="dot" style="background:#f4511e"></span> Desmanche</span>
        <span><span class="dot" style="background:#039be5"></span> Aceiro</span>
    </div>
</div>

<script>
    // Adicionamos um "carimbo de tempo" (timestamp) para o Google não mandar dado velho
    const urlAPI = "https://script.google.com/macros/s/AKfycbwJf26HEroJtLZauuNKNlq95g7CZ1xRW3zf-VCgl7EbMjb0AxTkV2SBoNANtGPdCJ0S/exec"; 

    async function carregarDashboard() {
        const barraGeral = document.getElementById('barra-geral');
        const container = document.getElementById('lista-retiros');

        try {
            // "cache: no-store" força o navegador a buscar na planilha, ignorando erros de cache do Chrome
            const resposta = await fetch(urlAPI, {
                method: 'GET',
                redirect: 'follow',
                cache: 'no-store' 
            });

            if (!resposta.ok) throw new Error('Falha na comunicação');
            const dados = await resposta.json();
            
            // Validação de segurança: se a planilha estiver vazia, avisa o usuário
            if (dados.erro) {
                barraGeral.style.background = "#ffa000";
                barraGeral.innerText = "Atenção: " + dados.erro;
                return;
            }

            // Renderização das Datas
            document.getElementById('data-inicio').innerText = "📅 INÍCIO: " + dados.info.inicio;
            document.getElementById('data-atualizacao').innerText = "🔄 ATUALIZAÇÃO: " + dados.info.atualizacao;
            
            // Barra Principal
            barraGeral.classList.remove('loading');
            barraGeral.style.background = "#4caf50";
            barraGeral.innerText = `Produção Total: ${Number(dados.info.operacao).toLocaleString('pt-BR')} m`;

            // Renderização dos Retiros
            container.innerHTML = dados.retiros.map(r => {
                let p = parseFloat(r.perc);
                // Se na planilha estiver 0.5, vira 50%. Se estiver 50, continua 50.
                let porcentagem = p <= 1 ? (p * 100).toFixed(1) : p.toFixed(1);

                return `
                    <div class="retiro-block">
                        <div class="label-row">
                            <span class="name">${r.nome}</span>
                            <span class="area">${Number(r.executado).toLocaleString('pt-BR')} / ${Number(r.total).toLocaleString('pt-BR')} m</span>
                        </div>
                        <div class="bar-container">
                            <div class="segment" style="width: ${porcentagem}%">
                                ${porcentagem}%
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

        } catch (erro) {
            console.error("Erro:", erro);
            barraGeral.classList.remove('loading');
            barraGeral.style.background = "#d32f2f";
            barraGeral.innerText = "Erro de Sincronização. Tente Ctrl+F5 ou use o Edge.";
        }
    }

    window.onload = carregarDashboard;
</script>

</body>
</html>
