<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --reforma: #FFD600;
            --cerca-nova: #27ae60;
            --desmanche: #FF3D00;
            --aceiro: #0f9ed5;
            --fundo: #ffffff;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: transparent; 
            margin: 0; padding: 10px; color: #1e293b;
            overflow-x: hidden;
        }

        .container { 
            background: var(--fundo); 
            padding: 20px; 
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        
        .header { border-bottom: 2px solid #e2e8f0; margin-bottom: 25px; padding-bottom: 10px; }
        .title { font-weight: 800; font-size: 16px; text-transform: uppercase; margin: 0; color: #00264b; }

        .date-info {
            font-size: 11px; color: #64748b; margin-top: 8px;
            display: flex; gap: 20px; font-weight: 500;
        }

        @keyframes slideIn {
            from { width: 0; opacity: 0; }
            to { width: var(--seg-width); opacity: 1; }
        }

        .overall-progress-section { margin-bottom: 30px; }
        .overall-label { font-size: 11px; font-weight: 700; margin-bottom: 10px; display: block; color: #475569; }
        
        .overall-bar { 
            height: 28px; background: #f1f5f9; border-radius: 6px; 
            overflow: hidden; border: 1px solid #e2e8f0; position: relative;
        }
        
        .done-main { 
            background: linear-gradient(90deg, #27ae60, #2ecc71); 
            height: 100%; color: white; font-size: 10px; 
            display: flex; align-items: center; justify-content: center; font-weight: 800;
            width: 100%;
        }

        .legend { display: flex; gap: 15px; margin-bottom: 20px; font-size: 11px; font-weight: 600; flex-wrap: wrap; }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .box { width: 14px; height: 14px; border-radius: 3px; }

        .retiro-block { 
            display: flex; align-items: center; margin-bottom: 12px; gap: 15px; 
            padding: 8px; border-radius: 6px;
        }

        .label-row { width: 200px; flex-shrink: 0; font-size: 11px; }
        .name { font-weight: 700; color: #00264b; display: block; }
        .area { font-size: 10px; color: #94a3b8; }
        
        .bar-wrapper { flex-grow: 1; }

        .bar-container { 
            height: 18px; 
            background: #f1f5f9; 
            border-radius: 4px; 
            overflow: hidden; 
            border: 1px solid #e2e8f0; 
            display: flex; 
            width: 100%; 
        }
        
        .segment {
            height: 100%;
            animation: slideIn 1.2s ease-out forwards;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            color: white;
            font-weight: 800;
            overflow: hidden;
            white-space: nowrap;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1 class="title">Monitoramento de Cercas - AgroSB</h1>
            <div class="date-info">
                <span id="data-inicio">📅 INÍCIO: --/--/----</span>
                <span id="data-atualizacao">🔄 ATUALIZAÇÃO: --/--/----</span>
                <span id="meta-info">🎯 META: 21.000 m/mês</span>
            </div>
        </div>

        <div class="overall-progress-section">
            <span class="overall-label">Status Consolidado</span>
            <div class="overall-bar">
                <div class="done-main" id="barra-geral">Carregando dados...</div>
            </div>
        </div>

        <div class="legend">
            <div class="legend-item"><div class="box" style="background:var(--reforma)"></div> Reforma</div>
            <div class="legend-item"><div class="box" style="background:var(--cerca-nova)"></div> Nova</div>
            <div class="legend-item"><div class="box" style="background:var(--desmanche)"></div> Desmanche</div>
            <div class="legend-item"><div class="box" style="background:var(--aceiro)"></div> Aceiro</div>
        </div>

        <div id="lista-retiros"></div>
    </div>

    <script>
    const urlAPI = "SUA_NOVA_URL_AQUI"; // Cole aqui a URL gerada no deploy

    async function carregarDashboard() {
        try {
            const resposta = await fetch(urlAPI, { cache: 'no-store' });
            const dados = await resposta.json();

            // 1. Topo do Dashboard
            document.getElementById('data-inicio').innerText = "📅 INÍCIO: " + dados.info.inicio;
            document.getElementById('data-atualizacao').innerText = "🔄 ATUALIZAÇÃO: " + dados.info.atualizacao;
            
            const metaG = dados.info.meta_global;
            const execG = dados.info.executado_global;
            const percG = ((execG / metaG) * 100).toFixed(1);

            document.getElementById('meta-valor').innerText = `🎯 META: ${metaG.toLocaleString('pt-BR')} ha`;
            
            const barraGeral = document.getElementById('execucao-geral-bar');
            barraGeral.style.width = percG + "%";
            barraGeral.innerText = `${execG.toLocaleString('pt-BR')} ha (${percG}%)`;

            // 2. Lista de Retiros Dinâmica
            const container = document.getElementById('lista-retiros');
            container.innerHTML = "";

            dados.retiros.forEach(r => {
                container.innerHTML += `
                    <div class="retiro-block">
                        <div class="label-row">
                            <span class="name">${r.nome}</span>
                            <span class="area">Total: ${r.area_total.toLocaleString('pt-BR')} ha | Plan: ${r.area_plan} ha</span>
                        </div>
                        <div class="bar-wrapper">
                            <div class="bar-container">
                                <div class="fill-planejado" style="width: ${r.p_meta}%"></div>
                                <div class="bar-fill" style="background:#27ae60; width: ${(r.p_exec * r.p_meta / 100)}%">
                                    ${r.p_exec.toFixed(0)}%
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

        } catch (e) { console.error("Erro:", e); }
    }
    window.onload = carregarDashboard;
</script>
</body>
</html>
